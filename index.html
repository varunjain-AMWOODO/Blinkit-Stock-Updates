<title>Blinkit SOH Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap">
<style>
/* Layout: left rail (desktop) / bottom tab bar (phone), yellow top band, white work surface with green actions */
:root{
  --yellow:#F8CB46; --yellow-ink:#3a2f00; --green:#0C831F; --green-soft:#E3F3E6; --green-ink:#075214;
  --bg:#F3F5F0; --surface:#FFFFFF; --surface2:#F8FAF6; --line:#E1E6DC; --fg:#1B221B; --muted:#5E6B5E;
  --warn:#B45309; --warn-soft:#FDF0D5; --crit:#C62828; --crit-soft:#FBE4E2; --info:#1F5FA8; --info-soft:#E1EDFA;
  --chart1:#0C831F; --chart2:#E0A800; --chart3:#C62828; --grid:#E6EAE1;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,40,20,.06),0 4px 14px rgba(20,40,20,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --green:#3DBA52; --green-soft:#16301b; --green-ink:#9be3a9; --bg:#0F130F; --surface:#171C17; --surface2:#1c221c; --line:#2a322a; --fg:#E8EEE5; --muted:#99A699;
  --warn:#F2B45A; --warn-soft:#3a2b10; --crit:#FF8A80; --crit-soft:#3d1c1a; --info:#8DBBF2; --info-soft:#17283d;
  --chart1:#3DBA52; --chart2:#F8CB46; --chart3:#FF8A80; --grid:#2a322a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --green:#3DBA52; --green-soft:#16301b; --green-ink:#9be3a9; --bg:#0F130F; --surface:#171C17; --surface2:#1c221c; --line:#2a322a; --fg:#E8EEE5; --muted:#99A699;
  --warn:#F2B45A; --warn-soft:#3a2b10; --crit:#FF8A80; --crit-soft:#3d1c1a; --info:#8DBBF2; --info-soft:#17283d;
  --chart1:#3DBA52; --chart2:#F8CB46; --chart3:#FF8A80; --grid:#2a322a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px}h3{font-size:15px;font-weight:700}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-family:var(--font-head);font-weight:800;font-size:17px;line-height:1.1}
.logo{width:36px;height:36px;border-radius:10px;background:var(--yellow);display:grid;place-items:center;color:var(--green)}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current="page"]{background:var(--green-soft);color:var(--green-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.railnote{margin-top:auto;font-size:12px;color:var(--muted);padding:8px}
main{min-width:0}
.topband{background:var(--yellow);color:var(--yellow-ink);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topband .row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;max-width:1280px;margin:0 auto}
.topband h1{font-size:22px;font-weight:800}
.topband small{display:block;font-size:12.5px;opacity:.85;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.g{background:var(--green-soft);color:var(--green-ink);border-color:transparent}
.chip.y{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.r{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.b{background:var(--info-soft);color:var(--info);border-color:transparent}
.page{max-width:1280px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card>header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.card>header p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:default;min-width:0;display:flex;flex-direction:column;gap:2px}
button.kpi{cursor:pointer}button.kpi:hover{border-color:var(--green)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--font-head);font-size:28px;font-weight:800;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.crit .v{color:var(--crit)}.kpi.warn .v{color:var(--warn)}
.up{color:var(--green-ink)}.down{color:var(--crit)}
.cols2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.cols3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.chartbox{position:relative;height:240px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.yellow{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}
.btn.danger{color:var(--crit)}.btn.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:38px;min-width:0;width:100%}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2);flex-wrap:wrap}
.seg.nw{flex-wrap:nowrap}
.seg button{white-space:nowrap}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:13px}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill b{font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{background:var(--surface2);font-size:12px;color:var(--muted);position:sticky;top:0;cursor:pointer;user-select:none}
th.nosort{cursor:default}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:200px}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
.sub{color:var(--muted);font-size:12px}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;color:var(--muted);font-size:12.5px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;background:var(--surface2);cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--green);background:var(--green-soft)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop strong{display:block;font-size:15px}
.drop span{color:var(--muted);font-size:12.5px}
.note{border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:8px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.crit{background:var(--crit-soft);color:var(--crit)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.ok{background:var(--green-soft);color:var(--green-ink)}
.stack{display:flex;flex-direction:column;gap:10px}
.rowflex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
details.month{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.month>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;font-weight:700}
details.month>summary::-webkit-details-marker{display:none}
details.month[open]>summary{border-bottom:1px solid var(--line)}
details.month .inner{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.assump{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.assump div{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px}
.assump b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;max-width:92vw;font-weight:600}
.selrow td{background:var(--green-soft)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;z-index:20;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
  .brand,.railnote{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;padding:6px 2px;font-size:10px;flex:1;align-items:center;text-align:center}
  body{padding-bottom:70px}
  .topband h1{font-size:19px}
  .kpi .v{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const fmt = n => n == null || isNaN(n) ? '–' : Math.round(n).toLocaleString('en-IN');
const fmt1 = n => n == null || !isFinite(n) ? '–' : (Math.round(n * 10) / 10).toLocaleString('en-IN');
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const monthOf = d => d.slice(0, 7);
const monthLabel = m => `${MONTHS[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}`;
const dateLabel = d => { const [y, m, dd] = d.split('-'); return `${+dd} ${MONTHS[+m - 1].slice(0, 3)} ${y}`; };
const prevMonth = m => { let y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1; if (mo === 0) { y--; mo = 12; } return `${y}-${pad(mo)}`; };
const dayNum = d => Math.round(Date.parse(d + 'T00:00:00Z') / 864e5);
const numFrom = v => { if (v == null || v === '') return null; if (typeof v === 'number') return isFinite(v) ? v : null; const s = String(v).replace(/[,\s₹]/g, ''); if (s === '' || isNaN(+s)) return null; return +s; };
const norm = h => String(h ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');

const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };

/* ---------- categories ---------- */
function catOf(name) {
  const n = String(name).toLowerCase();
  const rules = [[/wipe/, 'Wet wipes'], [/kitchen (towel|tissue)/, 'Kitchen paper'], [/garbage|trash|bin liner/, 'Garbage bags'],
    [/toothbrush|tongue clean/, 'Oral care'], [/hair brush|comb/, 'Personal care'], [/tumbler|bottle|sipper|flask|glass/, 'Drinkware'],
    [/plate|cutlery|disposable|cup/, 'Disposables'], [/tissue|napkin|toilet|pulls/, 'Tissues & toilet rolls']];
  for (const [re, c] of rules) if (re.test(n)) return c;
  return 'Other';
}

/* ---------- persistent storage (IndexedDB, memory fallback) ---------- */
const Store = {
  db: null, ok: false, mem: { snaps: new Map(), sales: new Map(), kv: new Map() },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('soh-tracker', 1);
        r.onupgradeneeded = () => { const d = r.result; ['snaps', 'sales'].forEach(s => d.createObjectStore(s, { keyPath: 'id' })); d.createObjectStore('kv'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
      this.ok = true;
      try { navigator.storage?.persist?.(); } catch (e) { }
    } catch (e) { this.ok = false; }
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode), s = t.objectStore(store); let out;
      try { out = fn(s); } catch (e) { rej(e); return; }
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  async all(store) { if (!this.ok) return [...this.mem[store].values()]; return this.tx(store, 'readonly', s => s.getAll()); },
  async put(store, val, key) { this.mem[store].set(store === 'kv' ? key : val.id, val); if (this.ok) { try { await this.tx(store, 'readwrite', s => store === 'kv' ? s.put(val, key) : s.put(val)); } catch (e) { this.ok = false; toast('Storage write failed. Data will not persist after refresh.'); } } },
  async del(store, id) { this.mem[store].delete(id); if (this.ok) await this.tx(store, 'readwrite', s => s.delete(id)); },
  async clear(store) { this.mem[store].clear(); if (this.ok) await this.tx(store, 'readwrite', s => s.clear()); },
  async getKv(key) { if (!this.ok) return this.mem.kv.get(key); return this.tx('kv', 'readonly', s => s.get(key)); }
};

async function handleFile(kind, file) {

}

const normUpc = v => String(v ?? '').replace(/\D/g, '').replace(/^0+/, '');
let mapIdx = { byUpc: new Map(), byId: new Map() };
function buildMapIdx() {
  mapIdx = { byUpc: new Map(), byId: new Map() };

}
const mapEntry = r => mapIdx.byUpc.get(normUpc(r.upc)) || mapIdx.byId.get(String(r.id)) || null;
const mskuOf = r => mapEntry(r)?.sku || '';
const hasMap = () => !!(S.map && S.map.rows.length);

}
const MAP_FIELDS = {
  upc: ['upc', 'barcode', 'ean', 'gtin', 'upccode', 'eancode'],
  sku: ['merchantsku', 'sellersku', 'vendorsku', 'merchantskucode', 'skucode', 'sku', 'partnerskuid', 'skuid', 'merchantcode', 'articlecode', 'materialcode', 'itemcode'],

  id: ['blinkititemid', 'itemid', 'blinkitid']

function parseMapping(sheets, filename) {

  const found = findHeader(sheets, MAP_FIELDS, ['upc', 'sku']) || findHeader(sheets, MAP_FIELDS, ['id', 'sku']);
  if (!found) { res.fatal = 'Could not find the mapping columns. The file needs a UPC (or Item ID) column and a merchant SKU column, for example "UPC" and "Merchant SKU".'; return res; }
  const { sheet, hi, map, header } = found; res.map = Object.entries(map).map(([f, i]) => ({ field: f, header: header[i] })); res.sheetName = sheet.name;
  let n = 0, errs = 0, warns = 0, dups = 0; const byKey = new Map(), skuUpcs = new Map();
  const add = (sev, row, field, msg) => { res.issues.push({ sev, row, field, msg }); sev === 'error' ? errs++ : warns++; };
  for (let r = hi + 1; r < sheet.rows.length; r++) {

    const upcRaw = g('upc') != null ? String(g('upc')).trim() : '', sku = String(g('sku') ?? '').trim(), id = g('id') != null ? String(g('id')).trim() : '';
    let bad = false;
    if (!sku) { add('error', xr, 'Merchant SKU', 'Missing merchant SKU'); bad = true; }
    if (map.upc != null) {
      if (!upcRaw && !id) { add('error', xr, 'UPC', 'Missing UPC'); bad = true; }

        else { const d = normUpc(upcRaw); if (!/^\d+$/.test(upcRaw.replace(/[\s-]/g, ''))) { add('error', xr, 'UPC', `UPC has non-numeric characters: "${upcRaw}"`); bad = true; } else if (d.length < 8 || d.length > 14) add('warn', xr, 'UPC', `UPC length ${d.length} is unusual (expected 8 to 14 digits)`); }
      }
    }

  res.stats = { read: n, valid: res.rows.length, errors: errs, warnings: warns, dups };

}

    if (!S.snaps.length && !(await Store.getKv('seeded')) && typeof SAMPLE !== 'undefined') {
      const rows = SAMPLE.map(a => ({ id: String(a[0]), nm: a[1], br: a[2], upc: a[3] || '', uom: a[4] || '', wid: String(a[5]), wn: a[6], cat: catOf(a[1]), sel: a[7], inc: a[8], uns: a[9], dmg: a[10], lost: a[11], exp: a[12], nex: a[13], s7: a[14], s15: a[15], s30: a[16] }));
      const snap = { id: uid(), date: '2026-11-08', uploadedAt: Date.parse('2026-11-08T03:26:47+05:30'), filename: 'InventoryData_46.xlsx', rows, meta: summarize(rows) };
      S.snaps.push(snap); await Store.put('snaps', snap); await Store.put('kv', true, 'seeded');
    }
  } catch (e) { console.error(e); }
  buildSalesIdx(); route();
}
boot();
